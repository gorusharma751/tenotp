# Render Blueprint — https://render.com/docs/blueprint-spec
# Plain Node/Express API — no Vite, no bundler. Realtime (MongoDB change
# streams over SSE) needs this persistent Node process, not a serverless
# function. Push this repo, then in the Render dashboard: New > Blueprint >
# point it at this repo's `backend/` directory (Render Blueprints support a
# monorepo `rootDir`), and fill in the secret env vars marked `sync: false`.
services:
  - type: web
    name: tenotp-backend
    runtime: node
    rootDir: backend
    plan: starter
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: APP_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://tenotp.vercel.app (your deployed frontend URL)
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: tenotp
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: bharatpe
      - key: PAYMENT_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GRIZZLYSMS_API_KEY
        sync: false
      - key: TIGERSMS_API_KEY
        sync: false
      - key: SMSBOWER_API_KEY
        sync: false
      - key: SASTASMS_API_KEY
        sync: false
      - key: FIVESIM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
