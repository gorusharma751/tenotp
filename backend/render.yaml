# Render Blueprint — https://render.com/docs/blueprint-spec
# Plain Node/Express API — no Vite, no bundler. Realtime (MongoDB change
# streams over SSE) needs this persistent Node process, not a serverless
# function. Push this repo, then in the Render dashboard: New > Blueprint >
# point it at this repo's `backend/` directory (Render Blueprints support a
# monorepo `rootDir`), and fill in the secret env vars marked `sync: false`.
services:
  - type: web
    name: tenotp-backend
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    branch: main
    buildCommand: npm install
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8787
      - key: APP_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false # e.g. https://tenotp.vercel.app (your deployed frontend URL)
      - key: MONGODB_URI
        sync: false
      # MongoDB database names are case-sensitive and the real production
      # database is "Tenotp" (capital T) — NOT "tenotp". This is a `value:`
      # (not `sync: false`), so Render's Blueprint sync enforces it from
      # this file on every deploy, silently overwriting any manual fix made
      # in the Render dashboard. Getting this wrong points the API at a
      # different, empty database — countries/services/providers all come
      # back empty and nothing looks "connected" even though the code and
      # the real database are both fine.
      - key: MONGODB_DB_NAME
        value: Tenotp
      - key: AUTH_JWT_SECRET
        generateValue: true
      - key: TELEGRAM_BOT_TOKEN
        sync: false # from @BotFather — Telegram Mini App login won't work until this is set
      - key: PAYMENT_PROVIDER
        value: bharatpe
      - key: PAYMENT_ENCRYPTION_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: GRIZZLYSMS_API_KEY
        sync: false
      - key: TIGERSMS_API_KEY
        sync: false
      - key: SMSBOWER_API_KEY
        sync: false
      - key: SASTASMS_API_KEY
        sync: false
      - key: FIVESIM_API_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
